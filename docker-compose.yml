services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: alluka
      POSTGRES_PASSWORD: akulla
      POSTGRES_DB: task-manager-backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  migrate:
    image: golang:1.23-alpine
    volumes:
      - ./migrations:/migrations
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: alluka
      DB_PASSWORD: akulla
      DB_NAME: task-manager-backend
    entrypoint: 
      - /bin/sh
      - -c
      - |
        go install github.com/pressly/goose/v3/cmd/goose@latest && \
        goose -dir /migrations postgres "postgres://alluka:akulla@postgres:5432/task-manager-backend?sslmode=disable" up
    depends_on:
      - postgres

  task_manager:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: alluka
      DB_PSWD: akulla
      DB_NAME: task-manager-backend
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_EMAIL: tasknotify.noreply@gmail.com
      SMTP_PASSWORD: ievo rwgc lyom krid
      JWT_SECRET: this_is_not_the_best_secret
    ports:
      - "9000:9000"

volumes:
  postgres-data: